# ==========================================
# ServiceMate - Spring Boot Application Config
# ==========================================

# Server Configuration
server.port=${PORT:8085}
server.servlet.context-path=/

# MySQL Database Configuration
# Automatically creates the database 'servicemate_db' if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/servicemate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# ddl-auto=update automatically creates/updates database tables from Java entities during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (JSON Web Token) Configuration
# The secret is loaded from the JWT_SECRET environment variable.
# A safe local fallback 256-bit key is provided for immediate out-of-the-box local development testing.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# WebSocket Configuration
app.websocket.endpoint=/ws-servicemate

# Google Gemini AI Configuration
# The API key must be supplied via the GEMINI_API_KEY environment variable.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

