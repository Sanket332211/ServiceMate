# ==========================================
# ServiceMate - Spring Boot Application Config
# ==========================================

# Server Configuration
server.port=${PORT:8085}
server.servlet.context-path=/

# MySQL Database Configuration
# Local Development (default fallback): connects to local MySQL servicemate_db on port 3306.
# Production (e.g. Aiven Cloud MySQL): set DB_URL (or SPRING_DATASOURCE_URL), DB_USERNAME, and DB_PASSWORD environment variables.
# Example Aiven DB_URL: jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/servicemate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# ddl-auto=update automatically creates/updates database tables from Java entities during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (JSON Web Token) Configuration
# The secret is loaded from the JWT_SECRET environment variable.
# A safe local fallback 256-bit key is provided for immediate out-of-the-box local development testing.
# In production profile ('prod'), a unique non-default JWT_SECRET is strictly enforced.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS & WebSocket Allowed Origins
# Configurable via FRONTEND_URL or APP_CORS_ALLOWED_ORIGINS (comma-separated list for production)
app.cors.allowed-origins=${FRONTEND_URL:${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}}

# WebSocket Configuration
app.websocket.endpoint=/ws-servicemate

# Development Data Seeding (Enabled by default in development; disabled in production profile or via APP_SEED_ENABLED=false)
app.data.seed-enabled=${APP_SEED_ENABLED:true}

# Google Gemini AI Configuration
# The API key must be supplied via the GEMINI_API_KEY environment variable.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

